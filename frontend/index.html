<!doctype html>
<html lang="da">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Platform Game</title>
    <style>
        body {
            margin: 0;
            /* background: #222; */

        }
        
        .game {
            overflow: hidden;
            max-width: 600px;

            position: relative;

        .background {
            /* background: rgb(52, 166, 251); */
            table-layout: fixed;
            border-spacing: 0;

        .playing {
            margin-top: 90px;
            padding: 100;
        }
        
        .playing {
            background-image: url("./assets/ForestBackground.png");
            background-repeat: no-repeat;
            /* background-size: contain, cover; */

            /* height: 100vw; */
        }
        
        .background td {
            padding: 0;
        }
        
        .lava {
            background: rgb(255, 100, 100);
        }
        /* .wall {
			background: grey;
		} */
        
        .actor {
            position: absolute;
        }
        
        .coin {
            background: rgb(241, 229, 89);
            border-radius: 50%;

        .wall {
            background-repeat: no-repeat;
            background-size: contain, cover;
            /* padding: 25px; */

        .wall:nth-of-type(4n-3) {
            background-image: url("./assets/platform_1.png");
        }
        
        .wall:nth-of-type(4n-2) {

        .wall:nth-of-type(4n-1) {

        }
        
        .wall:nth-of-type(4n-4) {
            background-image: url("./assets/platform_4.png");
        }
        /* .wall:nth-of-type(4n-3) {
			background-color: green;
		}
		.wall:nth-of-type(4n-2) {
			background-color: blue;
		}
		.wall:nth-of-type(4n-1) {
			background-color: grey;
		}
		.wall:nth-of-type(4n-4) {
			background-color: yellow;
		} */
        
        .player {
            /* background: rgb(64, 64, 64); */
            position: absolute;
            z-index: 10;
            width: 105px !important;
            height: 105px !important;
            padding: 0;
            background-image: url("./assets/Walk.gif");

        }

            background: rgb(160, 64, 64);
        }
        
        .won .player {
            box-shadow: -4px -7px 8px white, 4px -7px 8px white;
        }
        
        .popup {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            justify-content: center;

        }
        
        .btnOpenPopup,
        .btnClosePopup {
            cursor: pointer;
            border-radius: 5px;
        }
        
        .btnClosePopup {
            background-color: #28a745;
            margin-top: 10px;
            padding: 5px 10px;
            color: #fff;

            border-radius: 3px;
        }
        
        .popup-content {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        
        .btnOpenPopup {
            border: none;
            color: white;
            padding: 16px 32px;
            text-align: center;
            text-decoration: none;
            display: none;
            font-size: 16px;
            margin: 4px 2px;
            transition-duration: 0.4s;
            cursor: pointer;

            border: 2px solid #dc3545;
        }
        
        .btnOpenPopup:hover {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>

<body>
    <button id="openPopup" class="btnOpenPopup">Restart</button>
    <div id="popup" class="popup">
        <div class="popup-content">
            <h2>Wild Cat</h2>
            <p>Last highscore = xxxx</p>
            <button id="startP1" class="btnClosePopup">Start 1p</button>
            <button id="startP2" class="btnClosePopup">Start 2p</button>
        </div>
    </div>

    <script>
        let simpleLevelPlan1 = `
................................................................................................
................................................................................................
................................................................................................
@..............................................................o.o......o.oo......o.o...........
################################################################################################`;
        let simpleLevelPlan2 = `
................................................................................................
................................................................................................
..............................................................................=.........=.......
@.....................+.....+.....+.............................o.o......o.oo......o.o..........
################################################################################################`;
        let simpleLevelPlan3 = `
.......................................................
#.....................................................#
#..................=.........=.......=.......=........#
#.............o.o......o.oo......o.o.....o.o.....o.o..#
#.@..........#####....######....#####...#####...#####.#
#########.............................................#
....#####+++++++++++++++++++++++++++++++++++++++++++++#
....###################################################`;
        class Vec {
            constructor(x, y) {
                this.x = x;
                this.y = y
            }
            plus(other) {
                return new Vec(this.x + other.x, this.y + other.y)
            }
            times(factor) {
                return new Vec(this.x * factor, this.y * factor)
            }
        }
        class Level {
            constructor(plan) {
                let rows = plan.trim().split("\n").map(l => [...l]);
                this.height = rows.length;
                this.width = rows[0].length;
                this.startActors = [];
                this.rows = rows.map((row, y) => row.map((ch, x) => {
                    let type = levelChars[ch];
                    if (typeof type != "string") {
                        let pos = new Vec(x, y);
                        this.startActors.push(type.create(pos, ch));
                        type = "empty"
                    }
                    return type
                }))
            }
            touches(pos, size, type) {
                let xStart = Math.floor(pos.x),
                    xEnd = Math.ceil(pos.x + size.x),
                    yStart = Math.floor(pos.y),
                    yEnd = Math.ceil(pos.y + size.y);
                for (let y = yStart; y < yEnd; y++)
                    for (let x = xStart; x < xEnd; x++) {
                        let outside = x < 0 || x >= this.width || y < 0 || y >= this.height;
                        let here = outside ? "wall" : this.rows[y][x];
                        if (here == type) return true
                    }
                return false
            }
        }
        class State {
            constructor(level, actors, status) {
                this.level = level;
                this.actors = actors;
                this.status = status
            }
            static start(level) {
                return new State(level, level.startActors, "playing")
            }
            get player() {
                return this.actors.find(a => a.type == "player")
            }
            update(time, keys) {
                let actors = this.actors.map(actor => actor.update(time, this, keys));
                let state = new State(this.level, actors, this.status);
                if (state.status != "playing") return state;
                let player = state.player;
                if (this.level.touches(player.pos, player.size, "lava")) return new State(this.level, actors, "lost");
                for (let actor of actors)
                    if (actor != player && overlap(actor, player)) state = actor.collide(state);
                return state
            }
        }
        class Player {
            constructor(pos, speed, size = new Vec(.8, 1.5), started) {
                this.pos = pos;
                this.speed = speed;
                this.size = size;
                this.started = started;
            }

            get type() {
                return "player";
            }

            static create(pos) {
                return new Player(
                    pos.plus(new Vec(0, -.5)),
                    new Vec(0, 0)
                );
            }

            update(time, state, keys) {
                let xSpeed = 0;

                // if (keys.ArrowLeft) xSpeed -= 7;
                if (keys.ArrowRight) this.started = true;

                const element = document.querySelector(".player");

                if (this.started === true) {
                    xSpeed += 7;
                    // element.classList.remove("standStill");
                } else {
                    // element.classList.add("standStill");
                }

                let normalSize = new Vec(.8, 1.5);
                let crouchSize = new Vec(.8, .75);

                let pos = this.pos;
                let size = keys.ArrowDown ? crouchSize : normalSize;

                if (!keys.ArrowDown && this.size.y < normalSize.y) {
                    let standingPos = pos.plus(
                        new Vec(0, this.size.y - normalSize.y)
                    );

                    if (!state.level.touches(standingPos, normalSize, "wall")) {
                        pos = standingPos;
                    } else {
                        size = crouchSize;
                    }
                }

                let movedX = pos.plus(new Vec(xSpeed * time, 0));

                if (!state.level.touches(movedX, size, "wall")) {
                    pos = movedX;
                }

                let ySpeed = this.speed.y + time * 30;
                let movedY = pos.plus(new Vec(0, ySpeed * time));

                if (!state.level.touches(movedY, size, "wall")) {
                    pos = movedY;
                } else if (keys.ArrowUp && ySpeed > 0) {
                    ySpeed = -17;
                } else {
                    ySpeed = 0;
                }

                return new Player(
                    pos,
                    new Vec(xSpeed, ySpeed),
                    size,
                    this.started
                );
            }
        }

        class Lava {
            constructor(pos, speed, reset) {
                this.pos = pos;
                this.speed = speed;
                this.reset = reset
            }
            get type() {
                return "lava"
            }
            static create(pos, ch) {
                if (ch == "=") return new Lava(pos, new Vec(2, 0));
                if (ch == "|") return new Lava(pos, new Vec(0, 2));
                if (ch == "v") return new Lava(pos, new Vec(0, 3), pos)
            }
            update(time, state) {
                let pos = this.pos.plus(this.speed.times(time));
                if (!state.level.touches(pos, this.size, "wall")) return new Lava(pos, this.speed, this.reset);
                if (this.reset) return new Lava(this.reset, this.speed, this.reset);
                return new Lava(this.pos, this.speed.times(-1))
            }
            collide(state) {
                return new State(state.level, state.actors, "lost")
            }
        }
        Lava.prototype.size = new Vec(1, 1);
        class Coin {
            constructor(pos, basePos, wobble) {
                this.pos = pos;
                this.basePos = basePos;
                this.wobble = wobble
            }
            get type() {
                return "coin"
            }
            static create(pos) {
                let base = pos.plus(new Vec(.2, .1));
                return new Coin(base, base, Math.random() * Math.PI * 2)
            }
            update(time) {
                let wobble = this.wobble + time * 8;
                return new Coin(this.basePos.plus(new Vec(0, Math.sin(wobble) * .07)), this.basePos, wobble)
            }
            collide(state) {
                let actors = state.actors.filter(a => a != this);
                return new State(state.level, actors, actors.some(a => a.type == "coin") ? state.status : "won")
            }
        }
        Coin.prototype.size = new Vec(.6, .6);
        const levelChars = {
            ".": "empty",
            "#": "wall",
            "+": "lava",
            "@": Player,
            "o": Coin,
            "=": Lava,
            "|": Lava,
            "v": Lava
        };

        function elt(name, attrs, ...children) {
            let dom = document.createElement(name);
            for (let attr of Object.keys(attrs)) dom.setAttribute(attr, attrs[attr]);
            for (let child of children) dom.appendChild(child);
            return dom
        }
        const scale = 70;

        function drawGrid(level) {
            return elt("table", {
                class: "background",
                style: `width:${level.width*scale}px`
            }, ...level.rows.map(row => elt("tr", {
                style: `height:${scale}px`
            }, ...row.map(type => elt("td", {
                class: type
            })))))
        }

        function drawActors(actors) {
            return elt("div", {}, ...actors.map(actor => {
                let rect = elt("div", {
                    class: `actor ${actor.type}`
                });
                rect.style.width = `${actor.size.x*scale}px`;
                rect.style.height = `${actor.size.y*scale}px`;
                rect.style.left = `${actor.pos.x*scale}px`;
                rect.style.top = `${actor.pos.y*scale}px`;
                return rect
            }))
        }
        class DOMDisplay {
            constructor(parent, level) {
                this.dom = elt("div", {
                    class: "game"
                }, drawGrid(level));
                this.actorLayer = null;
                parent.appendChild(this.dom)
            }
            syncState(state) {
                if (this.actorLayer) this.actorLayer.remove();
                this.actorLayer = drawActors(state.actors);
                this.dom.appendChild(this.actorLayer);
                this.dom.className = `game ${state.status}`;
                let player = state.player,
                    center = player.pos.plus(player.size.times(.5)).times(scale);
                // this.dom.scrollLeft = center.x - this.dom.clientWidth / 2;
                // this.dom.scrollTop = center.y - this.dom.clientHeight / 2
                if (center.x > this.dom.clientWidth * 0.15) {
                    this.dom.scrollLeft = center.x - this.dom.clientWidth * 0.15;
                }
            }
            clear() {
                this.dom.remove()
            }
        }

        function overlap(a, b) {
            return a.pos.x + a.size.x > b.pos.x && a.pos.x < b.pos.x + b.size.x && a.pos.y + a.size.y > b.pos.y && a.pos.y < b.pos.y + b.size.y
        }

        function trackKeys(keys) {
            let down = Object.create(null);

            function track(event) {
                if (keys.includes(event.key)) {
                    down[event.key] = event.type == "keydown";
                    event.preventDefault()
                }
            }
            window.addEventListener("keydown", track);
            window.addEventListener("keyup", track);
            return down
        }
        const arrowKeys = trackKeys(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]);

        function runAnimation(frameFunc) {
            let lastTime = null;

            function frame(time) {
                if (lastTime != null) {
                    let step = Math.min(time - lastTime, 100) / 1000;
                    if (frameFunc(step) === false) return
                }
                lastTime = time;
                requestAnimationFrame(frame)
            }
            requestAnimationFrame(frame)
        }

        function runLevel(level, Display) {
            let display = new Display(document.body, level),
                state = State.start(level),
                ending = 1;
            return new Promise(resolve => runAnimation(time => {
                if (openedPopup) {
                    display.clear();
                    resolve("stopped");
                    return false;
                }
                state = state.update(time, arrowKeys);
                display.syncState(state);
                if (state.status == "playing") return true;
                if (ending > 0) {
                    ending -= time;
                    return true
                }
                display.clear();
                resolve(state.status);
                return false
            }))
        }
        let openedPopup = false;


        async function runGame(plans, Display) {
            for (let level = 0; level < plans.length;) {
                let result = await runLevel(new Level(plans[level]), Display);
                if (result === "stopped") return;
                if (result === "won") level++;
            }
            console.log("Game is over!")
        }

        const levels = [simpleLevelPlan1, simpleLevelPlan2, simpleLevelPlan3];
        const openPopup = document.getElementById('openPopup');
        const startP1 = document.getElementById('startP1');
        const startP2 = document.getElementById('startP2');
        const popup = document.getElementById('popup');

        openPopup.addEventListener('click', () => {
            popup.style.display = 'flex';
            openPopup.style.display = 'none';
            openedPopup = true;
            runGame([], DOMDisplay);
        });

        startP1.addEventListener('click', () => {
            popup.style.display = 'none';
            openPopup.style.display = 'inline-block';
            openedPopup = false;
            runGame(levels, DOMDisplay);
        });

        startP2.addEventListener('click', () => {
            popup.style.display = 'none';
            openPopup.style.display = 'inline-block';
            openedPopup = false;
            runGame(levels, DOMDisplay);
        });

        const API_URL = "https://127.0.0.1:7259";

        // api 
        async function getData() {
            try {
                const response = await fetch(
                    `${API_URL}/api/game/state/1`
                );

                if (response.status === 400) {
                    console.error("400: Ugyldig forespørgsel");
                    return;
                }

                if (response.status === 404) {
                    const errorText = await response.text();
                    console.error(`404: ${errorText}`);
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP-fejl: ${response.status}`);
                }

                const data = await response.json();
                console.log(data);

            } catch (error) {
                console.error("Kunne ikke hente data:", error);
            }
        }

        // getData();
        // setInterval(getData, 10000);


        // postScore(10);


        async function postScore(points) {
            try {
                const response = await fetch(
                    `${API_URL}/api/game/score/1?points=${points}`, {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP-fejl: ${response.status}`);
                }

                console.log(`Score opdateret med ${points} point`);
            } catch (error) {
                console.error("Kunne ikke opdatere score:", error);
            }
        }



        let gotBoost = false;


        postBoostName("Invisibility");

        async function postBoostName(boostName) {
            try {
                const response = await fetch(
                    `${API_URL}/api/game/boost/collect/1?boostName=${boostName}`, {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP-fejl: ${response.status}`);
                }

                console.log(`boost opdateret med ${boostName}`);
                gotBoost = true;
            } catch (error) {
                console.error("Kunne ikke opdatere boost:", error);
            }
        }

        if (gotBoost === true) postBoostUse();

        async function postBoostUse() {
            try {
                const response = await fetch(
                    `${API_URL}/api/game/boost/use/1`, {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP-fejl: ${response.status}`);
                }

                console.log(`boost use opdateret`);
            } catch (error) {
                console.error("Kunne ikke opdatere boost use:", error);
            }
        }
    </script>
</body>
