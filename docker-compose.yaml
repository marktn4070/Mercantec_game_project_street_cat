networks:
  dokploy-network:
    external: true

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - wildcat-backend
    networks:
      - dokploy-network
    restart: unless-stopped

  wildcat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - dokploy-network
    labels:
      traefik.enable: "false"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
