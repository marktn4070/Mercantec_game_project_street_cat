networks:
  dokploy-network:
    external: true
    name: dokploy-network

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - wildcat-backend
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.wildcat-web.rule: "Host(`${WILDCAT_FRONTEND_HOST:-wildcat.mercantec.tech}`)"
      traefik.http.routers.wildcat-web.entrypoints: web
      traefik.http.routers.wildcat-web.service: wildcat-web
      traefik.http.routers.wildcat-api.rule: "Host(`${WILDCAT_API_HOST:-api-wildcat.mercantec.tech}`) && PathPrefix(`/api/`)"
      traefik.http.routers.wildcat-api.entrypoints: web
      traefik.http.routers.wildcat-api.service: wildcat-web
      traefik.http.services.wildcat-web.loadbalancer.server.port: "80"
    restart: unless-stopped

  wildcat-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - dokploy-network
    labels:
      traefik.enable: "false"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
